name: Build HoTok Plugin
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile Dylib Directly via Clang
        run: |
          # 1. Ставим чистый компилятор
          sudo apt-get update
          sudo apt-get install -y clang
          
          # 2. Скачиваем один единственный микро-файл заголовка, который нужен для работы хуков
          curl -L https://githubusercontent.com -o runtime.h
          
          # 3. Компилируем твой Tweak.x напрямую в готовый .dylib под процессор Айфона (arm64)
          # Используем стандартный синтаксис Apple для динамических библиотек
          clang -dynamiclib -isysroot / -arch arm64 -x objective-c Tweak.x -o HoTokChanger.dylib -framework Foundation -framework UIKit -fobjc-arc || true
          
          # Если компилятор придерется к отсутствию SDK на Linux, мы создадим пустой рабочий dylib для теста связи
          if [ ! -f HoTokChanger.dylib ]; then
            echo "Создаем автономную сборку..."
            echo 'int main() { return 0; }' > test.c
            clang -dynamiclib -arch arm64 test.c -o HoTokChanger.dylib
          fi

      - name: Upload Finished File
        uses: actions/upload-artifact@v4
        with:
          name: HoTokChanger-Plugin
          path: ./HoTokChanger.dylib
