name: Build HoTok Plugin
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Everything In One Step
        run: |
          # 1. Жестко объявляем пути для текущей сессии
          export THEOS=$GITHUB_WORKSPACE/theos
          
          # 2. Скачиваем Theos напрямую в рабочую область проекта
          git clone --recursive https://github.com $THEOS
          
          # 3. Скачиваем официальный iOS SDK
          curl -LO https://github.com
          tar -xf iPhoneOS14.5.sdk.tar.xz -C $THEOS/sdks/
          rm iPhoneOS14.5.sdk.tar.xz
          
          # 4. Создаем Makefile с жестко прописанным путем к свежему Theos
          echo "TARGET = iphone:clang:latest:14.0" > Makefile
          echo "ARCHS = arm64" >> Makefile
          echo "THEOS_DEVICE_IP =" >> Makefile
          echo "include $THEOS/makefiles/common.mk" >> Makefile
          echo "TWEAK_NAME = HoTokChanger" >> Makefile
          echo "HoTokChanger_FILES = Tweak.x" >> Makefile
          echo "HoTokChanger_CFLAGS = -fobjc-arc" >> Makefile
          echo "include $THEOS/makefiles/tweak.mk" >> Makefile
          
          # 5. Запускаем компиляцию
          make package GO_EASY=1 FINALPACKAGE=1
          
          # 6. Переносим готовый файл в корень для загрузки
          mv .theos/obj/HoTokChanger.dylib $GITHUB_WORKSPACE/HoTokChanger.dylib

      - name: Upload Finished File
        uses: actions/upload-artifact@v4
        with:
          name: HoTokChanger-Plugin
          path: ./HoTokChanger.dylib
